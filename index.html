<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Josué & Génesis 🖤</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    background:#000;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Montserrat', sans-serif;
    overflow:hidden;
}

.container{
    text-align:center;
    padding:30px;
    width:90%;
    max-width:600px;
}

h1{
    font-weight:300;
    font-size:2rem;
    letter-spacing:3px;
    margin-bottom:10px;
}

.date{
    font-size:0.9rem;
    opacity:0.6;
    margin-bottom:40px;
}

.timer{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:25px;
}

.time-box{
    border:1px solid rgba(255,255,255,0.1);
    padding:20px 10px;
    border-radius:20px;
    backdrop-filter:blur(5px);
}

.number{
    font-size:2.5rem;
    font-weight:700;
}

.label{
    font-size:0.8rem;
    letter-spacing:2px;
    opacity:0.6;
    margin-top:5px;
}

.message{
    margin-top:50px;
    font-weight:300;
    font-size:0.9rem;
    opacity:0.8;
    letter-spacing:1px;
}

/* Corazones aesthetic */
.heart{
    position:absolute;
    bottom:-20px;
    color:#ff4d6d;
    animation:float 8s linear infinite;
    opacity:0.6;
}

@keyframes float{
    0%{
        transform:translateY(0) scale(1);
        opacity:0.6;
    }
    100%{
        transform:translateY(-110vh) scale(1.5);
        opacity:0;
    }
}

/* Responsive */
@media(max-width:400px){
    .number{
        font-size:2rem;
    }
    h1{
        font-size:1.6rem;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>JOSUÉ & GÉNESIS</h1>
    <div class="date">Nuestro noviazgo - el 14 de Febrero 2026</div>

    <div class="timer">
        <div class="time-box">
            <div class="number" id="dias">0</div>
            <div class="label">DÍAS</div>
        </div>
        <div class="time-box">
            <div class="number" id="horas">00</div>
            <div class="label">HORAS</div>
        </div>
        <div class="time-box">
            <div class="number" id="minutos">00</div>
            <div class="label">MINUTOS</div>
        </div>
        <div class="time-box">
            <div class="number" id="segundos">00</div>
            <div class="label">SEGUNDOS</div>
        </div>
    </div>

    <div class="message">
        TE ELIJO EN CADA MOMENTO <BR>TE AMO MI HERMOSA 😍</BR>
    </div>
</div>

<script>
const fechaInicio = new Date("2026-02-14T21:00:00-06:00");


function actualizarContador(){
    const ahora = new Date();
    const diferencia = ahora - fechaInicio;

    const dias = Math.floor(diferencia/(1000*60*60*24));
    const horas = Math.floor((diferencia/(1000*60*60))%24);
    const minutos = Math.floor((diferencia/(1000*60))%60);
    const segundos = Math.floor((diferencia/1000)%60);

    document.getElementById("dias").textContent = dias;
    document.getElementById("horas").textContent = formato(horas);
    document.getElementById("minutos").textContent = formato(minutos);
    document.getElementById("segundos").textContent = formato(segundos);
}

function formato(t){
    return t<10 ? "0"+t : t;
}

setInterval(actualizarContador,1000);
actualizarContador();

function crearCorazon(){
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤";
    heart.style.left = Math.random()*100+"vw";
    heart.style.fontSize = (Math.random()*15+15)+"px";
    heart.style.animationDuration = (Math.random()*4+4)+"s";
    document.body.appendChild(heart);

    setTimeout(()=>heart.remove(),8000);
}

setInterval(crearCorazon,700);
</script>

</body>
</html>
